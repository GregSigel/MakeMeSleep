{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2>Bon retour dans votre bulle</h2>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" name="username" placeholder="Votre pseudonyme" required>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
        </div>

        <button type="submit" class="btn-primary btn-full">Entrer</button>
    </form>

    <div class="form-footer">
        <p>Pas encore de compte ? <a href="{{ url_for('register') }}">S'inscrire</a></p>
    </div>
</div>
{% endblock %}
