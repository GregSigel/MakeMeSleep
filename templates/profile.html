{% extends 'base.html' %}

{% block content %}
<div class="profile-container">
    <h2>Mon Espace Personnel</h2>

    <!-- Section Chaîne -->
    <section class="profile-card">
        <h3>🎥 Ma Chaîne</h3>
        <form method="POST" action="{{ url_for('update_channel') }}">
            <div class="form-group">
                <label>Nom de la chaîne</label>
                <input type="text" name="channel_name" value="{{ current_user.channel.name if current_user.channel else '' }}" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="3">{{ current_user.channel.description if current_user.channel else '' }}</textarea>
            </div>
            <button type="submit" class="btn-primary">Enregistrer les modifications</button>
        </form>
    </section>

    <!-- Section Sécurité -->
    {% if current_user.password %}
    <section class="profile-card">
        <h3>🔒 Changer de mot de passe</h3>
        <form method="POST" action="{{ url_for('change_password') }}">
            <div class="form-group">
                <label>Mot de passe actuel</label>
                <input type="password" name="current_password" required>
            </div>
            <div class="form-group">
                <label>Nouveau mot de passe</label>
                <input type="password" name="new_password" required>
            </div>
            <div class="form-group">
                <label>Confirmer le nouveau mot de passe</label>
                <input type="password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn-primary">Mettre à jour le mot de passe</button>
        </form>
    </section>
    {% endif %}

    <!-- Zone de danger -->
    <section class="profile-card danger-zone">
        <h3>⚠️ Zone de danger</h3>
        <p>La suppression de votre compte effacera également votre chaîne et tous vos contenus de manière irréversible.</p>
        <form method="POST" action="{{ url_for('delete_account') }}" onsubmit="return confirm('Êtes-vous sûr de vouloir supprimer définitivement votre compte ?');">
            <button type="submit" class="btn-danger">Supprimer mon compte</button>
        </form>
    </section>
</div>
{% endblock %}
